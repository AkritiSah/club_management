{% if messages %}
  <div class="messages-container mb-3">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show d-flex align-items-center shadow-sm" role="alert">
        <i class="bi 
          {% if message.tags == 'success' %}bi-check-circle-fill text-success
          {% elif message.tags == 'danger' %}bi-exclamation-octagon-fill text-danger
          {% elif message.tags == 'warning' %}bi-exclamation-triangle-fill text-warning
          {% else %}bi-info-circle-fill text-info{% endif %} 
          me-2 fs-5"></i>
        <div class="flex-grow-1">{{ message }}</div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  </div>
{% endif %}
